services:
  - type: web
    name: healthbridge360-source3-api
    runtime: python
    plan: free
    rootDir: render_api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HB360_API_EVENT_COUNT
        value: "2500"
      - key: HB360_API_SEED
        value: "36009"
      - key: HB360_API_SCHEMA_V2_RATE
        value: "0.60"
      - key: HB360_API_SOURCE_SYSTEM
        value: "HEALTHBRIDGE360_EVENT_PLATFORM"
      - key: HB360_API_NULL_RATE
        value: "0.02"
      - key: HB360_API_WHITESPACE_RATE
        value: "0.02"
      - key: HB360_API_CASE_VARIATION_RATE
        value: "0.02"
      - key: HB360_API_INVALID_VALUE_RATE
        value: "0.01"
      - key: HB360_API_MISSING_CRITICAL_ID_RATE
        value: "0.005"
      - key: HB360_API_BAD_DATE_RATE
        value: "0.003"
      - key: HB360_API_FUTURE_TIMESTAMP_RATE
        value: "0.003"
      - key: HB360_API_TIMESTAMP_FORMAT_VARIATION_RATE
        value: "0.005"
      - key: HB360_API_DUPLICATE_RATE
        value: "0.01"
      - key: HB360_API_LATE_ARRIVAL_RATE
        value: "0.02"
      - key: HB360_API_ORPHAN_REFERENCE_RATE
        value: "0.005"
      - key: HB360_API_FAILURE_RATE
        value: "0.00"
